<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tIMP Faucet — Imperium Testnet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a1a;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #12122a;
      border: 1px solid #2a2a5a;
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #7b68ee, #4a9eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 14px; color: #8888bb; margin-bottom: 32px; }
    .info {
      background: #1a1a3a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #b0b0d0;
      line-height: 1.6;
    }
    .info strong { color: #7b68ee; }
    #claimBtn {
      width: 100%;
      background: linear-gradient(135deg, #7b68ee, #4a9eff);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    #claimBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(123,104,238,0.4); }
    #claimBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .pending { color: #fbbf24; }
    .footer { margin-top: 24px; font-size: 12px; color: #555577; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💧 tIMP Faucet</h1>
    <p class="subtitle">Imperium Testnet (Chain ID 9818)</p>

    <div class="info">
      <strong>Regole:</strong><br />
      • 1 tIMP per wallet<br />
      • 1 volta ogni 24 ore<br />
      • Solo su testnet
    </div>

    <button id="claimBtn" disabled>Connetti Wallet</button>
    <div id="status"></div>

    <p class="footer">Quantum Imperium — Testnet Faucet</p>
  </div>

  <script>
    const RPC_URL = "https://rpc-testnet.imperiumscan.com";
    const CHAIN_ID = 9818;
    const FAUCET_ADDRESS = "0x41eBa3cc73d07F3ea82E15b77B70a511c599113f";
    const TOKEN_ADDRESS  = "0xBea13F68aE21Fc20a07FA863FF136756E9031cD0";

    const FAUCET_ABI = [
      "function drip() external",
      "function canClaim(address) view returns (bool, uint256)"
    ];
    const TOKEN_ABI = [
      "function balanceOf(address) view returns (uint256)"
    ];

    let provider, signer, userAddress, faucet, token;

    const btn = document.getElementById("claimBtn");
    const status = document.getElementById("status");

    function setStatus(msg, cls = "") {
      status.textContent = msg;
      status.className = cls;
    }

    async function connect() {
      if (!window.ethereum) {
        setStatus("MetaMask non trovato", "error");
        return;
      }
      try {
        await window.ethereum.request({ method: "eth_requestAccounts" });

        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: "0x" + CHAIN_ID.toString(16) }],
          });
        } catch (switchErr) {
          if (switchErr.code === 4902) {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [{
                chainId: "0x" + CHAIN_ID.toString(16),
                chainName: "Imperium Testnet",
                nativeCurrency: { name: "tIMP", symbol: "tIMP", decimals: 18 },
                rpcUrls: [RPC_URL],
                blockExplorerUrls: ["https://explorer-testnet.imperiumscan.com"],
              }],
            });
          } else {
            throw switchErr;
          }
        }

        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();

        faucet = new ethers.Contract(FAUCET_ADDRESS, FAUCET_ABI, signer);
        token = new ethers.Contract(TOKEN_ADDRESS, TOKEN_ABI, provider);

        const bal = await token.balanceOf(userAddress);
        const [can, secondsLeft] = await faucet.canClaim(userAddress);

        btn.disabled = false;
        if (can) {
          btn.textContent = "Richiedi 1 tIMP";
        } else {
          const hours = Math.ceil(Number(secondsLeft) / 3600);
          btn.textContent = `Aspetta ${hours}h`;
          btn.disabled = true;
        }
        setStatus(`${userAddress.slice(0,6)}...${userAddress.slice(-4)} | Saldo: ${ethers.formatUnits(bal, 18)} tIMP`, "success");
      } catch (e) {
        console.error(e);
        setStatus("Errore connessione: " + e.message, "error");
      }
    }

    async function claim() {
      try {
        btn.disabled = true;
        setStatus("Invio transazione...", "pending");
        const tx = await faucet.drip();
        setStatus("In attesa di conferma...", "pending");
        await tx.wait();
        setStatus("✅ 1 tIMP ricevuto!", "success");
        setTimeout(connect, 2000);
      } catch (e) {
        console.error(e);
        setStatus("Errore: " + (e.reason || e.message), "error");
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", () => {
      if (!userAddress) connect();
      else claim();
    });

    if (window.ethereum) {
      window.ethereum.request({ method: "eth_accounts" }).then(accounts => {
        if (accounts.length > 0) connect();
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.0/dist/ethers.umd.min.js"></script>
</body>
</html>
